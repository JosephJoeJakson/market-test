<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoursesApp</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Navigation -->
    <header class="navbar">
      <div class="container">
        <div class="logo">COURSESAPP</div>
        <nav>
          <a href="/liste.html">Liste de course</a>
          <a href="/index.html">Produits disponibles</a>

        </nav>
      </div>
    </header>

    <!-- Contenu du corps -->
    <main class="container">
      <!-- Haut de page -->
      <section class="top-bar">
        <div class="left">
          <h1>Produits disponibles</h1>
          <span id="compteur-produits" class="badge">0 produit</span>
        </div>
        <div class="right">
          <input type="search" id="recherche" placeholder="Rechercher un produit..." />
          <select id="tri">
            <option value="nom">Trier par nom</option>
            <option value="prix">Trier par prix</option>
          </select>
          <button id="reset-filtres">Réinitialiser</button>
        </div>
      </section>

      <!-- Section produits -->
      <section>
        <ul id="liste-produits" class="product-grid">
          <!-- Produit ajouté avec du JS -->
        </ul>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
